<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loadout</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Font: Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <main class="loadout-container">
      <!-- Top row -->
      <div class="tile tile-6">Weather</div>
      <!-- top-left -->
      <div class="tile tile-1">Flying</div>
      <!-- top -->
      <div class="tile tile-7">Lodging</div>

      <!-- Middle row -->
      <div class="tile tile-4">Pets</div>
      <!-- left -->
      <div class="center-tile center">You</div>
      <!-- center -->
      <div class="tile tile-2">Road Trip</div>
      <!-- right -->

      <!-- Bottom row -->
      <div class="tile tile-5">Minimalist</div>
      <!-- bottom-left -->
      <div class="tile tile-3">Backpacking</div>
      <!-- bottom -->
      <div class="tile tile-8">Activities</div>
      <!-- bottom - right -->
    </main>
  </body>
</html>
